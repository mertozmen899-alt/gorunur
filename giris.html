<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş yap | Görünür</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){var t;try{t=localStorage.getItem('gorunur_tema')}catch(e){}if(t!=='acik'&&t!=='koyu')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'koyu':'acik';document.documentElement.dataset.tema=t;if(t==='koyu'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.content='#0F1217'}})()</script>
<link rel="stylesheet" href="assets/style.css?v=22">
<script src="assets/tema.js?v=1" defer></script>
<script src="assets/iletisim.js?v=1" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/auth.js?v=4"></script>
<script src="assets/sayac.js?v=1" defer></script>
</head>
<body>
<div class="test-govde">
<div class="kap" style="width:100%">
<div class="test-ust">
<a href="./" class="logo" aria-label="Görünür ana sayfa">
<span class="logo-isaret"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></span>
<span class="logo-ad">Görünür</span>
</a>
<div class="test-sag">
<a href="./" style="font-size:14px;font-weight:600;color:var(--soluk)">Ana sayfa</a>
</div>
</div>
</div>

<main class="test" style="max-width:480px">
<div class="sekmeler" role="tablist" aria-label="Giriş veya hesap açma">
<button type="button" role="tab" id="sekme-giris" aria-selected="true" aria-controls="form-giris">Giriş yap</button>
<button type="button" role="tab" id="sekme-kayit" aria-selected="false" aria-controls="form-kayit">Hesap aç</button>
</div>

<form id="form-giris" class="form hesap-form" novalidate role="tabpanel" aria-labelledby="sekme-giris">
<h1 tabindex="-1">Tekrar hoş geldiniz</h1>
<p class="acik">Panelinize ve bu haftanın işlerine buradan girersiniz.</p>
<label class="etk" for="g-eposta">E-posta</label>
<input id="g-eposta" class="girdi" type="email" autocomplete="email" inputmode="email" required>
<label class="etk" for="g-sifre">Şifre</label>
<input id="g-sifre" class="girdi" type="password" autocomplete="current-password" required>
<div class="uyari koyu-uyari" role="alert" aria-live="assertive"></div>
<button type="submit" class="btn btn-amber" style="width:100%;margin-top:8px">Giriş yap</button>
<button type="button" id="unuttum" class="geri" style="align-self:flex-start">Şifremi unuttum</button>
</form>

<form id="form-kayit" class="form hesap-form" novalidate role="tabpanel" aria-labelledby="sekme-kayit" hidden>
<h1 tabindex="-1">Ücretsiz hesap açın</h1>
<p class="acik">Sadece e-posta ve şifre. İşletme bilgilerinizi bir sonraki adımda, 5 kısa soruda alacağız.</p>
<label class="etk" for="k-eposta">E-posta</label>
<input id="k-eposta" class="girdi" type="email" autocomplete="email" inputmode="email" required>
<label class="etk" for="k-sifre">Şifre</label>
<input id="k-sifre" class="girdi" type="password" autocomplete="new-password" minlength="8" required aria-describedby="sifre-not">
<p id="sifre-not" style="font-size:13px;color:var(--soluk);margin:6px 0 0">En az 8 karakter.</p>
<label class="onay onay-koyu"><input type="checkbox" id="k-onay"><span><a href="aydinlatma.html" target="_blank" rel="noopener">Aydınlatma metnini</a> okudum. Hesabımı yönetmek ve ölçüm sonuçlarını göndermek için bilgilerimin işlenmesini kabul ediyorum.</span></label>
<div class="uyari koyu-uyari" role="alert" aria-live="assertive"></div>
<button type="submit" class="btn btn-amber" style="width:100%;margin-top:8px">Hesap aç</button>
</form>

<div id="bilgi" class="tesekkur" hidden style="margin-top:20px">
<strong id="bilgi-baslik"></strong>
<p id="bilgi-metin" style="margin:8px 0 0;font-size:15px;line-height:1.55"></p>
</div>
</main>
</div>

<script>
(function () {
  var A = window.GorunurAuth;
  var sekmeler = { giris: document.getElementById('sekme-giris'), kayit: document.getElementById('sekme-kayit') };
  var formlar = { giris: document.getElementById('form-giris'), kayit: document.getElementById('form-kayit') };
  function sec(ad) {
    Object.keys(sekmeler).forEach(function (k) {
      sekmeler[k].setAttribute('aria-selected', k === ad ? 'true' : 'false');
      formlar[k].hidden = k !== ad;
    });
    document.getElementById('bilgi').hidden = true;
  }
  sekmeler.giris.addEventListener('click', function () { sec('giris'); });
  sekmeler.kayit.addEventListener('click', function () { sec('kayit'); });
  if (location.hash === '#kayit') sec('kayit');

  function bilgi(baslik, metin) {
    var b = document.getElementById('bilgi');
    document.getElementById('bilgi-baslik').textContent = baslik;
    document.getElementById('bilgi-metin').textContent = metin;
    b.hidden = false;
  }
  function yonlendir() {
    return A.isletmeGetir().then(function (i) {
      location.replace(A.KOK + (i && i.kurulum_bitti ? 'panel.html' : 'kurulum.html'));
    });
  }

  // Zaten girişliyse doğrudan yönlendir
  A.oturum().then(function (s) { if (s) yonlendir(); });

  function mesgul(form, evet) {
    var b = form.querySelector('button[type=submit]');
    b.disabled = evet;
    b.dataset.metin = b.dataset.metin || b.textContent;
    b.textContent = evet ? 'Bekleyin…' : b.dataset.metin;
  }

  formlar.giris.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = formlar.giris, u = f.querySelector('.uyari');
    var eposta = document.getElementById('g-eposta').value.trim(), sifre = document.getElementById('g-sifre').value;
    if (!eposta || !sifre) { u.textContent = 'E-posta ve şifrenizi yazın.'; return; }
    u.textContent = ''; mesgul(f, true);
    A.sb.auth.signInWithPassword({ email: eposta, password: sifre }).then(function (r) {
      if (r.error) throw r.error;
      return yonlendir();
    }).catch(function (err) { u.textContent = A.hataMetni(err); mesgul(f, false); });
  });

  formlar.kayit.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = formlar.kayit, u = f.querySelector('.uyari');
    var eposta = document.getElementById('k-eposta').value.trim(), sifre = document.getElementById('k-sifre').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(eposta)) { u.textContent = 'Lütfen geçerli bir e-posta adresi yazın.'; return; }
    if (sifre.length < 8) { u.textContent = 'Şifre en az 8 karakter olmalı.'; return; }
    if (!document.getElementById('k-onay').checked) { u.textContent = 'Devam etmek için onay kutusunu işaretleyin.'; return; }
    u.textContent = ''; mesgul(f, true);
    A.sb.auth.signUp({ email: eposta, password: sifre, options: { emailRedirectTo: A.KOK + 'kurulum.html' } }).then(function (r) {
      if (r.error) throw r.error;
      if (r.data.session) { location.replace(A.KOK + 'kurulum.html'); return; }
      mesgul(f, false); f.hidden = true;
      bilgi('E-postanızı kontrol edin', eposta + ' adresine bir onay bağlantısı gönderdik. Bağlantıya tıklayınca kuruluma devam edeceksiniz.');
    }).catch(function (err) { u.textContent = A.hataMetni(err); mesgul(f, false); });
  });

  document.getElementById('unuttum').addEventListener('click', function () {
    var f = formlar.giris, u = f.querySelector('.uyari');
    var eposta = document.getElementById('g-eposta').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(eposta)) { u.textContent = 'Önce yukarıya e-posta adresinizi yazın.'; return; }
    A.sb.auth.resetPasswordForEmail(eposta, { redirectTo: A.KOK + 'sifre.html' }).then(function (r) {
      if (r.error) throw r.error;
      bilgi('Bağlantı gönderildi', 'Bu adrese kayıtlı bir hesap varsa şifre yenileme bağlantısı gönderdik.');
    }).catch(function (err) { u.textContent = A.hataMetni(err); });
  });
})();
</script>
</body>
</html>
