<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağlantı yok</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFFFFF;color:#1A1917;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .kutu{max-width:340px}
  .isaret{width:64px;height:64px;border-radius:18px;background:#FFC145;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#57534E;line-height:1.55;margin:0 0 24px}
  button{background:#F5B301;color:#141414;border:0;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="kutu">
  <div class="isaret"><svg width="34" height="34" viewBox="0 0 32 32" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"><circle cx="16" cy="16" r="4"/><path d="M16 4v4M16 24v4M4 16h4M24 16h4"/></svg></div>
  <h1>İnternet bağlantısı yok</h1>
  <p>Görünür'ü açmak için internete bağlanın. Wi-Fi veya mobil veriyi kontrol edip tekrar deneyin.</p>
  <button type="button" onclick="if(window.GorunurUygulama){GorunurUygulama.tekrarDene()}else{history.back()}">Tekrar dene</button>
</div>
</body>
</html>
