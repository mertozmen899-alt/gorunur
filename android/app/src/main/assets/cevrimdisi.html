<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağlantı yok</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFFFFF;color:#161A22;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .kutu{max-width:340px}
  .isaret{width:64px;height:64px;border-radius:18px;background:transparent;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#5B6375;line-height:1.55;margin:0 0 24px}
  button{background:#FD703C;color:#111318;border:0;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="kutu">
  <div class="isaret"><svg width="56" height="56" viewBox="0 0 256 256" fill="none" stroke="#FD703C" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"><path d="M30 205V95a50 50 0 0 1 100 0v65a50 50 0 0 0 100 0V90"/></svg></div>
  <h1>İnternet bağlantısı yok</h1>
  <p>Norevo'yu açmak için internete bağlanın. Wi-Fi veya mobil veriyi kontrol edip tekrar deneyin.</p>
  <button type="button" onclick="if(window.NorevoUygulama){NorevoUygulama.tekrarDene()}else{history.back()}">Tekrar dene</button>
</div>
</body>
</html>
